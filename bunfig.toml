[fmt]
printWidth = 120
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
trailingComma = "all"

# Built-in enhancements
sortImports = true
sortPackageJson = true
jsdoc = true


[lint]
plugins = ["unused-imports", "import"]
typeAware = true
ignorePatterns = ["scripts/install-autoi18n.mjs"]

[lint.rules]
"@typescript-eslint/consistent-type-imports" = "error"
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-floating-promises" = "error"
"@typescript-eslint/no-misused-promises" = "error"
"@typescript-eslint/no-non-null-assertion" = "error"
"@typescript-eslint/no-unnecessary-condition" = "error"
"@typescript-eslint/no-unnecessary-type-assertion" = "error"
"@typescript-eslint/strict-boolean-expressions" = "error"

"bun/format" = "error"
"bun:test/expect-expect" = "error"
"bun:test/no-disabled-tests" = "error"
"bun:test/no-focused-tests" = "error"
"bun:test/no-identical-title" = "error"
"bun/no-cwd-dependent-path" = "error"
"bun/no-env-at-module-scope" = "error"
"bun/no-side-effects-on-import" = "error"
"bun/no-unportable-commands" = "error"

"default-case" = "error"
"eqeqeq" = "error"

"import/no-cycle" = "error"
"import/no-duplicates" = "error"
"import/no-extraneous-dependencies" = "error"
"import/no-unresolved" = "error"

"no-constant-condition" = "error"
"no-debugger" = "error"
"no-duplicate-imports" = "error"
"no-empty" = "error"
"no-eval" = "error"
"no-implied-eval" = "error"
"no-nested-ternary" = "error"
"no-new-func" = "error"
"no-prototype-builtins" = "error"
"no-script-url" = "error"
"no-self-compare" = "error"
"no-throw-literal" = "error"
"no-unreachable" = "error"
"no-var" = "error"

"prefer-const" = "error"
"unused-imports/no-unused-imports" = "error"
